name: Pipeline CI/CD Backend Ventas AWS ECR

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repositorio fuente
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v3

      # 2. Configurar credenciales dinámicas de AWS Academy
      - name: 2. Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 3. Iniciar sesión en Amazon ECR
      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Construir y subir imagen apuntando a la subcarpeta real
      - name: 4. Construir y subir imagen a Amazon ECR
        uses: docker/build-push-action@v4
        with:
          # 🌟 Le indicamos a la acción que camine hasta la ruta donde está tu código
          context: back-Ventas_SpringBoot/Springboot-API-REST
          file: back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          # Usamos tu ID de cuenta activo (264683506277) con el que acabas de desplegar Despachos
          tags: 264683506277.dkr.ecr.us-east-1.amazonaws.com/innovatech-back-ventas:latest

  deploy-to-private-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 5. Desplegar saltando por el Frontend público directo al Backend privado
      - name: 5. Desplegar usando EC2-Frontend como puente (Bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "10.0.138.187"       # 🌟 Tu IP privada real de la máquina Backend unificada
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: "35.171.177.194" # Tu IP Elástica fija del Frontend
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            # Autenticar Docker internamente en la máquina privada
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 264683506277.dkr.ecr.us-east-1.amazonaws.com
            
            # Descargar la imagen de Ventas y levantarla sin molestar a Despachos
            docker compose pull back-ventas
            docker compose up -d --remove-orphans back-ventas